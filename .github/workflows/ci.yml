name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Guards against the executable bit getting lost again (core.fileMode is
      # often off on Windows dev machines, so `git update-index --chmod=+x`
      # can silently regress on a future Windows-authored commit).
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # google-services.json is gitignored (Firebase project config) and the
      # app's Google Sign-In code needs the resources the google-services
      # Gradle plugin generates from it, so CI restores the real file from a
      # repo secret. See README/CLAUDE.md for how to add GOOGLE_SERVICES_JSON.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Print Version
        run: |
          echo "versionName: $(git describe --tags --always | sed 's/^v//')"
          echo "versionCode: $(git rev-list --count HEAD)"

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      # Signing keystore is gitignored (private key material) and absent on a
      # fresh clone or CI without secrets. Restored from repo secrets the same
      # way google-services.json is above; bundleRelease still succeeds without
      # it, just producing an unsigned bundle (see keystore.properties.example).
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/app/release.keystore
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Bundle release
        run: ./gradlew bundleRelease --console=plain

      - name: Upload release bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
