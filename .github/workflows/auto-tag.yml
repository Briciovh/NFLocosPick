name: Auto Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Serializes back-to-back merges so they don't race on "what's the latest tag".
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Bump is driven by the merged branch's prefix: feature/* -> minor,
      # everything else (fix/*, chore/*, docs/*, ...) -> patch. "Latest"
      # considers both v-prefixed and bare semver tags (this repo has a
      # legacy bare "1.2.0" tag with a Release attached), but new tags are
      # always created with the "v" prefix for consistency going forward.
      - name: Compute and push next version tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu

          git fetch --tags --force

          version=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
          version=${version:-0.0.0}
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)

          case "$HEAD_REF" in
            feature/*)
              minor=$((minor + 1))
              patch=0
              ;;
            *)
              patch=$((patch + 1))
              ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          echo "Tagging $new_tag (merged branch: $HEAD_REF, previous version: $version)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$new_tag" -m "Release $new_tag"
          git push origin "$new_tag"
