name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is gitignored (Firebase project config) and the
      # app's Google Sign-In code needs the resources the google-services
      # Gradle plugin generates from it, so CI restores the real file from a
      # repo secret. See README/CLAUDE.md for how to add GOOGLE_SERVICES_JSON.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
