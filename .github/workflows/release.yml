name: Release

# Only fires when a human explicitly publishes a GitHub Release on a tag
# (auto-tag.yml creates the tag itself, but does not publish a release) --
# that's the deliberate gate before a signed, Play-Store-ready bundle exists.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # google-services.json is gitignored (Firebase project config) and the
      # app's Google Sign-In code needs the resources the google-services
      # Gradle plugin generates from it, so CI restores the real file from a
      # repo secret. See README/CLAUDE.md for how to add GOOGLE_SERVICES_JSON.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      # Signing keystore is gitignored (private key material) and absent on a
      # fresh clone or CI without secrets. bundleRelease still succeeds
      # without it, just producing an unsigned bundle (see
      # keystore.properties.example).
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/app/release.keystore
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Bundle release
        run: ./gradlew bundleRelease --console=plain

      - name: Upload release bundle artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Attach bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/build/outputs/bundle/release/*.aab --clobber
